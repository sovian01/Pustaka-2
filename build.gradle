plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nie.pustaka'
    compileSdk 34

    defaultConfig {
        applicationId "com.nie.pustaka"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // Dipakai FileStorageManager untuk membaca Folder Chapter lewat SAF (DocumentFile)
    // tanpa harus menyalin file ke storage app.
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // Tidak butuh dependency Flask/Python/server apapun.
    // Semua logika backend ada di WebAppInterface.kt (murni Kotlin + SQLite bawaan Android).
}
